<!DOCTYPE html>
<html>
<head>
  <base href="/admin/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="QNX Mart - Battery Regeneration System">

  <!-- ✅ Google Maps API Script -->
  <script async defer
          src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtuIRCXUATyplH9aMH3d7lPwmpK5tT5To&libraries=places&callback=initMap">
  </script>


  <!-- ✅ Google Maps Initialize Function -->
  <script>
    function initMap() {
      console.log('✅ Google Maps loaded successfully!');
      // Flutter Web App ला notify करा
      if (window.flutterWeb && window.flutterWeb.onMapLoaded) {
        window.flutterWeb.onMapLoaded();
      }
    }

    // ✅ Flutter Web App ready झाल्यावर call होईल
    window.addEventListener('load', function() {
      console.log('✅ Web App loaded!');
    });
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QNX Mart">
  <link rel="apple-touch-icon" href="favicon.png">

  <title>QNX Mart</title>
  <link rel="manifest" href="manifest.json">


  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

  <script>
    // Your Firebase config
     const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "qnxmart.firebaseapp.com",
      projectId: "qnxmart",
      storageBucket: "qnxmart.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID",
    };

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then(function(registration) {
          console.log('Service Worker registered:', registration);
        })
        .catch(function(err) {
          console.log('Service Worker registration failed:', err);
        });
    }
  </script>
</head>
<body>
<!-- Flutter Web App -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
