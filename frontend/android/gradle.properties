# Memory: leave enough RAM for the Dart compiler (it ran out of memory with -Xmx8G).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true

# Compile Kotlin inside the Gradle process (no separate Kotlin daemon eating RAM).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1G

# One task at a time - slower but uses much less memory.
org.gradle.parallel=false
org.gradle.workers.max=2